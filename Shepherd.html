<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shepherd - Maniatopia</title>
    <meta name="description" content="Shepherd, videojuego y juego de mesa del universo Maniatopia.">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Almendra:wght@700&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: url('assets/images/fondo-shepherd.png') no-repeat center center fixed;
            background-size: cover;
            overflow: hidden;
        }

        :root {
            --pad: clamp(56px, 8vw, 110px);
            --logo-w: clamp(255px, 36vw, 510px);
        }

        /* Las imágenes tienen mucho margen transparente: se recortan al área visible */
        .game-logo {
            position: absolute;
            top: var(--pad);
            left: var(--pad);
            display: block;
            width: var(--logo-w);
            aspect-ratio: 760 / 305;
            padding: 0;
            border: 0;
            cursor: pointer;
            background: url('assets/images/ShepherdLogoMainMenuGame.png') no-repeat;
            background-size: 180.26% auto;
            background-position: 50.8% 10.8%;
            transition: transform 0.25s ease, filter 0.25s ease;
        }

        .game-logo:hover,
        .game-logo:focus-visible {
            transform: scale(1.03);
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.6));
        }

        /* Papiro desplegable bajo el logo; el texto escala con el ancho del papiro */
        .papiro {
            position: fixed;
            top: calc(var(--pad) + var(--logo-w) * 305 / 760 - 12px);
            left: var(--pad);
            height: calc(100vh - var(--pad) - var(--logo-w) * 305 / 760 + 12px - 20px);
            aspect-ratio: 1024 / 1536;
            max-width: calc(100vw - var(--pad) - 20px);
            container-type: inline-size;
            background: url('assets/images/papiro.png') center / 100% 100% no-repeat;
            filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.6));
            z-index: 20;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            clip-path: inset(0 0 100% 0);
            transition: clip-path 800ms cubic-bezier(0.2, 0.75, 0.25, 1), opacity 400ms ease, visibility 0s linear 800ms;
        }

        .papiro.is-open {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            clip-path: inset(0 0 0 0);
            transition: clip-path 800ms cubic-bezier(0.2, 0.75, 0.25, 1), opacity 400ms ease, visibility 0s;
        }

        .papiro-content {
            position: absolute;
            inset: 17% 17% 15% 17%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 9cqw;
            text-align: center;
            color: #3b2410;
        }

        .papiro-title {
            font-family: 'Almendra', 'Cinzel', serif;
            font-weight: 700;
            font-size: 8.4cqw;
            line-height: 1.25;
        }

        .papiro-download {
            font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
            font-size: 4.6cqw;
            font-weight: 600;
            color: #3b2410;
            overflow-wrap: anywhere;
            text-decoration: underline;
            text-underline-offset: 3px;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .papiro-download:hover,
        .papiro-download:focus-visible {
            color: #8a2a0a;
            transform: scale(1.04);
        }

        .board-game-btn {
            position: absolute;
            top: clamp(56px, 8vw, 110px);
            right: clamp(56px, 8vw, 110px);
            display: block;
            width: clamp(255px, 36vw, 510px);
            aspect-ratio: 1150 / 466;
            padding: 0;
            border: 0;
            cursor: pointer;
            background: url('assets/images/Shepherd board game.png') no-repeat;
            background-size: 145.65% auto;
            background-position: 57.14% 42.3%;
            transition: transform 0.25s ease, filter 0.25s ease;
        }

        .board-game-btn:hover,
        .board-game-btn:focus-visible {
            transform: scale(1.05);
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.6));
        }

        .toast {
            position: fixed;
            top: calc(var(--pad) + var(--logo-w) * 466 / 1150 + 8px);
            right: var(--pad);
            width: var(--logo-w);
            padding: 22px 16px;
            text-align: center;
            font-family: 'Almendra', 'Cinzel', serif;
            font-weight: 700;
            font-size: clamp(1.4rem, 2.6vw, 2.2rem);
            color: #3b2410;
            background: linear-gradient(135deg, #f3dba4, #e2bd78);
            border: 2px solid #8a5a24;
            border-radius: 14px;
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.6);
            z-index: 30;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translateY(-8px);
            transition: opacity 250ms ease, transform 250ms ease, visibility 0s linear 250ms;
        }

        .toast.is-visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition: opacity 250ms ease, transform 250ms ease, visibility 0s;
        }

        .back-link {
            position: fixed;
            bottom: clamp(28px, 4vw, 56px);
            left: clamp(28px, 4vw, 56px);
            display: block;
            width: clamp(150px, 18vw, 260px);
            aspect-ratio: 1240 / 590;
            background: url('assets/images/Volver-Shepherd.png') no-repeat;
            background-size: 113.55% auto;
            background-position: 47.6% 53.4%;
            transition: transform 0.25s ease, filter 0.25s ease;
        }

        .back-link:hover,
        .back-link:focus-visible {
            transform: scale(1.05);
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.6));
        }
    </style>
</head>
<body>
    <div class="papiro" id="papiro" role="region" aria-label="Descargas de Shepherd the Game">
        <div class="papiro-content">
            <p class="papiro-title">Versiones en construcción de Shepherd the Game descargables</p>
            <a class="papiro-download" href="Shepherd-Videogame0.1.exe" download>Shepherd-Videogame0.1.exe</a>
        </div>
    </div>

    <button class="game-logo" id="game-logo" type="button" aria-label="Shepherd - The Game: mostrar descargas" aria-expanded="false" aria-controls="papiro"></button>

    <button class="board-game-btn" id="board-game-btn" type="button" aria-label="Shepherd - Board Game" title="Shepherd - Board Game"></button>

    <div class="toast" id="toast" role="status" aria-live="polite">Trabajando en ello</div>

    <a class="back-link" href="universos.html" aria-label="Volver" title="Volver"></a>

    <script>
        const logo = document.getElementById('game-logo');
        const papiro = document.getElementById('papiro');
        const boardBtn = document.getElementById('board-game-btn');
        const toast = document.getElementById('toast');

        function setPapiro(open) {
            papiro.classList.toggle('is-open', open);
            logo.setAttribute('aria-expanded', String(open));
        }

        function setToast(visible) {
            toast.classList.toggle('is-visible', visible);
        }

        logo.addEventListener('click', (e) => {
            e.stopPropagation();
            setToast(false);
            setPapiro(!papiro.classList.contains('is-open'));
        });

        boardBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            setPapiro(false);
            setToast(true);
        });

        papiro.addEventListener('click', (e) => e.stopPropagation());
        window.addEventListener('click', () => {
            setPapiro(false);
            setToast(false);
        });
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                setPapiro(false);
                setToast(false);
            }
        });
    </script>
    <script src="musica.js"></script>
</body>
</html>
