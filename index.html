<<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maniatopia - Música y Magia</title>
    <meta name="description" content="Maniatopia: Un refugio digital de música ambiental, fantasía y atmósfera onírica.">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            width: 100vw;
            background: url('fondo.png') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Cinzel', serif, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
        }

        .content {
            text-align: center;
        }

        h1 {
            font-size: 4rem;
            letter-spacing: 4px;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            font-size: 1.5rem;
            letter-spacing: 2px;
            opacity: 0.9;
        }

        /* --- ANIMACIÓN DE LOS PUNTOS SUSPENSIVOS --- */
        .dots::after {
            content: '';
            display: inline-block;
            width: 1.5em; /* Ancho fijo para que el texto principal no "baile" */
            text-align: left;
            animation: dotsAnimation 1.8s steps(4, jump-none) infinite;
        }

        @keyframes dotsAnimation {
            0%   { content: ''; }
            25%  { content: '.'; }
            50%  { content: '..'; }
            75%  { content: '...'; }
            100% { content: ''; }
        }

        /* Contenedor del widget interactivo */
        #gramofono-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            cursor: pointer;
            z-index: 1000;
            width: 120px;
            height: 120px;
            user-select: none;
        }

        #gramofono-img, #gramofono-canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: filter 0.3s ease, opacity 0.3s ease;
        }

        /* Estado pausado: escala de grises y ligera transparencia */
        .paused-style {
            filter: grayscale(100%);
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="content">
        <h1>MANIATOPIA</h1>
        <!-- Separamos la palabra de la clase de los puntos -->
        <p class="subtitle">CREANDO<span class="dots"></span></p>
    </div>

    <!-- Audio de fondo -->
    <audio id="bg-audio" loop src="bolero.mp3"></audio>

    <!-- Widget Gramófono -->
    <div id="gramofono-container" title="Reproducir / Pausar">
        <img id="gramofono-img" src="gramofono-maniatopia.gif" alt="Gramófono Maniatopia">
        <canvas id="gramofono-canvas" style="display: none;"></canvas>
    </div>

    <script>
        const audio = document.getElementById('bg-audio');
        const container = document.getElementById('gramofono-container');
        const img = document.getElementById('gramofono-img');
        const canvas = document.getElementById('gramofono-canvas');
        const ctx = canvas.getContext('2d');

        let isPlaying = false;

        function togglePlay() {
            if (isPlaying) {
                // 1. Pausar el audio
                audio.pause();
                isPlaying = false;

                // 2. Capturar el fotograma actual en el Canvas para congelarlo
                canvas.width = img.naturalWidth || img.clientWidth || 120;
                canvas.height = img.naturalHeight || img.clientHeight || 120;
                
                try {
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                } catch (e) {
                    console.log("Error de renderizado:", e);
                }

                // 3. Mostrar el canvas con el fotograma fijo y ocultar el GIF
                img.style.display = 'none';
                canvas.style.display = 'block';

                // 4. Aplicar escala de grises
                canvas.classList.add('paused-style');
                img.classList.add('paused-style');
            } else {
                // 1. Reproducir el audio
                audio.play().then(() => {
                    isPlaying = true;

                    // 2. Volver a mostrar el GIF animado en color y ocultar el Canvas
                    canvas.style.display = 'none';
                    img.style.display = 'block';

                    // 3. Quitar escala de grises
                    canvas.classList.remove('paused-style');
                    img.classList.remove('paused-style');
                }).catch(err => {
                    console.log("Autoplay bloqueado o error al reproducir:", err);
                });
            }
        }

        container.addEventListener('click', togglePlay);

        // Intento de reproducción automática inicial
        window.addEventListener('DOMContentLoaded', () => {
            audio.play().then(() => {
                isPlaying = true;
            }).catch(() => {
                // Si el navegador bloquea el audio automático, empieza congelado/pausado
                audio.pause();
                isPlaying = false;
                canvas.width = 120;
                canvas.height = 120;
                if(img.complete) {
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                }
                img.style.display = 'none';
                canvas.style.display = 'block';
                canvas.classList.add('paused-style');
                img.classList.add('paused-style');
            });
        });
    </script>
</body>
</html>
