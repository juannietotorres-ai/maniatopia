<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maniatopia - Coming Soon</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-image: url('fondo.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
        }

        p {
            font-size: 1.5rem;
            margin-top: 0;
        }

        .puntos::after {
            content: '';
            display: inline-block;
            animation: puntosBucle 2s infinite steps(4);
        }

        @keyframes puntosBucle {
            0%   { content: ''; }
            25%  { content: '.'; }
            50%  { content: '..'; }
            75%  { content: '...'; }
            100% { content: ''; }
        }

        audio {
            margin-top: 2rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <h1>MANIATOPIA</h1>
    <p>Próximamente<span class="puntos"></span></p>

    <!-- Reproductor de audio con autoplay y bucle -->
    <audio controls autoplay loop>
        <source src="bolero.mp3" type="audio/mpeg">
        Tu navegador no soporta el elemento de audio.
    </audio>

</body>
</html>
