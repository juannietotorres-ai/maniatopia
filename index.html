<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maniatopia - Shepherd</title>
    <meta name="description" content="Maniatopia: Un refugio digital de música ambiental, fantasía y atmósfera onírica.">
    
<!-- FAVICON DE LA GALAXIA -->
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Homemade+Apple&family=Special+Elite&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            width: 100vw;
            background: url('fondo-maniatopia.jpg') no-repeat left center fixed;
            background-size: cover;
            font-family: 'Cinzel', serif, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
        }

        /* --- LOGOTIPO TRANSPARENTE SOBRE EL ESPACIO OSCURO --- */
        .logo-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 72vw;
            max-width: 1000px;
            z-index: 1000;
        }

        .logo-container img {
            display: block;
            width: 100%;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 15px rgba(0, 0, 0, 0.9));
        }

        /* --- TEXTO CENTRADO EN LA BASE DE LA PORTADA --- */
        .content {
            text-align: center;
            z-index: 10;
            position: fixed;
            bottom: 9vh;
            left: 50%;
            width: 100%;
            transform: translateX(-50%);
        }

        p.subtitle {
            font-size: 1.5rem;
            letter-spacing: 2px;
            opacity: 0.9;
            display: inline-block;
            position: relative;
        }

        .dots::after {
            content: '';
            position: absolute;
            left: 100%;
            top: 0;
            display: inline-block;
            width: 1.5em;
            text-align: left;
            animation: dotsAnimation 1.8s steps(4, jump-none) infinite;
        }

        @keyframes dotsAnimation {
            0%   { content: ''; }
            25%  { content: '.'; }
            50%  { content: '..'; }
            75%  { content: '...'; }
            100% { content: ''; }
        }

        /* --- MENÚ DESPLEGABLE --- */
        #menu-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 210px;
            height: 210px;
            z-index: 2000;
            perspective: 1100px;
        }

        #menu-btn {
            background: url('puerta botonera.png') center / contain no-repeat;
            border: 0;
            padding: 0;
            appearance: none;
            position: absolute;
            bottom: 0;
            left: 0;
            width: 210px;
            height: 210px;
            z-index: 2;
            cursor: pointer;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.7));
            transform-origin: left bottom;
            transition: transform 900ms cubic-bezier(0.2, 0.75, 0.25, 1), opacity 700ms ease, filter 700ms ease;
        }

        #menu-btn:hover {
            transform: scale(1.05);
        }

        #menu-btn:focus-visible {
            outline: 3px solid #e0c090;
            outline-offset: 6px;
        }

        #menu-dropdown {
            position: absolute;
            bottom: 0;
            left: 0;
            width: min(86vw, 680px);
            height: min(76vh, 620px);
            min-height: 280px;
            z-index: 1;
            background: radial-gradient(ellipse at 28% 72%, #101018 0%, #050508 64%);
            border-radius: 24px 120px 22px 22px;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.9), inset 0 0 45px rgba(25, 34, 55, 0.25);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            clip-path: polygon(0 100%, 0 100%, 0 100%);
            transform: scale(0.2);
            transform-origin: left bottom;
            transition: clip-path 850ms cubic-bezier(0.2, 0.75, 0.25, 1), transform 800ms cubic-bezier(0.2, 0.75, 0.25, 1), opacity 450ms ease, visibility 0s linear 850ms;
        }

        #menu-container.is-open #menu-dropdown {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            clip-path: polygon(0 100%, 0 15%, 14% 0, 100% 0, 100% 100%);
            transform: scale(1);
            transition: clip-path 850ms cubic-bezier(0.2, 0.75, 0.25, 1), transform 800ms cubic-bezier(0.2, 0.75, 0.25, 1), opacity 450ms ease, visibility 0s;
        }

        #menu-container.is-open #menu-btn {
            transform: translate(190px, -135px) scale(2.5) rotate(8deg) rotateY(-38deg);
            opacity: 0.28;
            filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.9));
        }

        #menu-dropdown a {
            position: absolute;
            z-index: 3;
            display: inline-flex;
            align-items: center;
            width: max-content;
            max-width: calc(100% - 48px);
            text-decoration: none;
            opacity: 0;
            transform: translateY(22px) scale(0.92);
            transition: opacity 400ms ease, transform 500ms cubic-bezier(0.2, 0.75, 0.25, 1), filter 250ms ease;
        }

        #menu-container.is-open #menu-dropdown a {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        #menu-dropdown .nav-home {
            left: 48px;
            top: 12%;
            transition-delay: 180ms;
        }

        .home-icon {
            width: 68px;
            height: 68px;
            fill: none;
            stroke: #f4c76b;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 10px rgba(255, 195, 86, 0.75));
            transition: transform 250ms ease, filter 250ms ease;
        }

        #menu-dropdown .nav-home:hover .home-icon,
        #menu-dropdown .nav-home:focus-visible .home-icon {
            transform: scale(1.16) rotate(-5deg);
            filter: drop-shadow(0 0 18px rgba(255, 221, 130, 1));
        }

        #menu-dropdown .nav-location {
            left: 34px;
            top: 32%;
            font-family: 'Homemade Apple', cursive;
            font-size: clamp(1.6rem, 3.6vw, 2.35rem);
            letter-spacing: 0;
            white-space: nowrap;
            background: linear-gradient(110deg, #ff4b08, #ff8a18, #ffc04a, #ff5a0a, #ff4b08);
            background-size: 250% 100%;
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 9px rgba(255, 91, 8, 0.7));
            animation: fireFlow 6s ease-in-out infinite alternate;
            transition-delay: 300ms;
        }

        #menu-dropdown .nav-location:hover,
        #menu-dropdown .nav-location:focus-visible {
            filter: drop-shadow(0 0 17px rgba(255, 151, 34, 1));
            transform: translateY(-2px) scale(1.06);
        }

        #menu-dropdown .nav-universes {
            left: 40px;
            top: 52%;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: clamp(1.05rem, 2.3vw, 1.55rem);
            letter-spacing: 3px;
            text-transform: uppercase;
            white-space: nowrap;
            background: linear-gradient(110deg, #7b5cff, #3fd0ff, #d86bff, #6a8cff, #7b5cff);
            background-size: 250% 100%;
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 8px rgba(120, 130, 255, 0.75));
            animation: cosmicFlow 7s ease-in-out infinite alternate;
            transition-delay: 360ms;
        }

        #menu-dropdown .nav-universes:hover,
        #menu-dropdown .nav-universes:focus-visible {
            filter: drop-shadow(0 0 16px rgba(120, 220, 255, 1));
            transform: translateY(-2px) scale(1.06);
        }

        @keyframes cosmicFlow {
            from { background-position: 0% 50%; }
            to { background-position: 100% 50%; }
        }

        #menu-dropdown .nav-contact {
            left: 48px;
            top: 72%;
            font-family: 'Special Elite', monospace;
            font-size: clamp(1.35rem, 2.8vw, 2rem);
            letter-spacing: 2px;
            color: #d7e9ff;
            text-shadow: 0 0 12px rgba(119, 181, 255, 0.75);
            transition-delay: 420ms;
        }

        #menu-dropdown .nav-contact:hover,
        #menu-dropdown .nav-contact:focus-visible {
            color: #ffffff;
            text-shadow: 0 0 20px rgba(136, 202, 255, 1);
            transform: translateY(-2px) scale(1.06);
        }

        @keyframes fireFlow {
            from { background-position: 0% 50%; }
            to { background-position: 100% 50%; }
        }

        /* --- GRAMÓFONO ESTABILIZADO --- */
        #gramofono-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            cursor: pointer;
            z-index: 1000;
            width: 110px;
            height: 110px;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #gramofono-img, #gramofono-canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform: scaleX(-1);
            transition: filter 0.3s ease, opacity 0.3s ease;
        }

        .fast-heartbeat {
            animation: pulseFast 0.8s infinite ease-in-out;
            filter: grayscale(0%) drop-shadow(0 0 8px rgba(224, 192, 144, 0.6));
        }

        @keyframes pulseFast {
            0% { transform: scaleX(-1) scale(0.95); }
            50% { transform: scaleX(-1) scale(1.10); filter: grayscale(0%) drop-shadow(0 0 14px rgba(255, 215, 0, 0.9)); }
            100% { transform: scaleX(-1) scale(0.95); }
        }

        .paused-style {
            filter: grayscale(100%);
            opacity: 0.65;
        }

        /* --- MÓVIL --- */
        @media (max-width: 768px) {
            .logo-container { width: 96vw; top: 44%; }
            .content { bottom: 11vh; }
            p.subtitle { font-size: 1.1rem; letter-spacing: 1px; }
            #gramofono-container { width: 85px; height: 85px; bottom: 15px; right: 15px; }
            #menu-container { bottom: 15px; left: 15px; width: 175px; height: 175px; }
            #menu-btn { width: 175px; height: 175px; }
            #menu-dropdown { width: min(88vw, 480px); height: min(76vh, 620px); min-height: 260px; }
            #menu-container.is-open #menu-btn { transform: translate(115px, -105px) scale(2.5) rotate(7deg) rotateY(-35deg); }
            #menu-dropdown .nav-home { left: 28px; }
            #menu-dropdown .nav-location { left: 24px; font-size: clamp(1.25rem, 5.3vw, 1.85rem); }
            #menu-dropdown .nav-universes { left: 28px; font-size: clamp(0.95rem, 4.2vw, 1.3rem); letter-spacing: 2px; }
            #menu-dropdown .nav-contact { left: 32px; font-size: clamp(1.2rem, 5vw, 1.65rem); }
            .home-icon { width: 58px; height: 58px; }
        }

        @media (prefers-reduced-motion: reduce) {
            #menu-btn, #menu-dropdown, #menu-dropdown a, .home-icon { transition-duration: 0.01ms; }
            #menu-dropdown .nav-location, #menu-dropdown .nav-universes { animation: none; }
        }
    </style>
</head>
<body>

    <!-- LOGOTIPO TRANSPARENTE DE MANIATOPIA -->
    <div class="logo-container">
        <img src="maniatopia-logo.png" alt="Maniatopia">
    </div>

    <!-- TEXTO CENTRAL -->
    <div class="content">
        <p class="subtitle"><span id="subtitle-word">CONSTRUYENDO</span><span class="dots"></span></p>
    </div>

    <!-- MENÚ DESPLEGABLE -->
    <div id="menu-container">
        <button id="menu-btn" type="button" title="Menú de navegación" aria-label="Abrir menú de navegación" aria-controls="menu-dropdown" aria-expanded="false"></button>
        <div id="menu-dropdown">
            <a class="nav-home" href="index.html" aria-label="Inicio" title="Inicio">
                <svg class="home-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 10.5 12 3l9 7.5M5.5 9.5V21h13V9.5M9 21v-7h6v7"></path>
                </svg>
            </a>
            <a class="nav-location" href="donde-estoy.html">¿Dónde estoy?</a>
            <a class="nav-universes" href="universos.html">Refugio de Universos</a>
            <a class="nav-contact" href="contacto.html">Contacto</a>
        </div>
    </div>

    <!-- AUDIO DE FONDO -->
    <audio id="bg-audio" loop src="bolero.mp3"></audio>

    <!-- WIDGET GRAMÓFONO -->
    <div id="gramofono-container" title="Haz clic para escuchar la música">
        <img id="gramofono-img" class="fast-heartbeat" src="gramofono-maniatopia.gif" alt="Gramófono Maniatopia">
        <canvas id="gramofono-canvas" style="display: none;"></canvas>
    </div>

    <script>
        // Primera visita absoluta: "CONSTRUYENDO". Después: palabra aleatoria sin repetir hasta agotar el ciclo.
        (function () {
            const words = ['CREANDO', 'COCINANDO', 'FILOSOFANDO', 'IMAGINANDO', 'DESCANSANDO', 'JUGANDO', 'FABRICANDO', 'EXPERIMENTANDO', 'EDIFICANDO', 'TERRAFORMANDO'];
            const target = document.getElementById('subtitle-word');
            const pick = (list) => list[Math.floor(Math.random() * list.length)];
            try {
                if (localStorage.getItem('maniatopiaVisited') !== '1') {
                    localStorage.setItem('maniatopiaVisited', '1');
                    return;
                }
                let pending = JSON.parse(localStorage.getItem('maniatopiaPending') || '[]')
                    .filter((w) => words.includes(w));
                const last = localStorage.getItem('maniatopiaLast');
                if (pending.length === 0) pending = words.slice();
                // Al empezar un ciclo nuevo, evita repetir la última palabra del anterior
                const options = pending.length === words.length && pending.length > 1
                    ? pending.filter((w) => w !== last)
                    : pending;
                const word = pick(options);
                pending.splice(pending.indexOf(word), 1);
                localStorage.setItem('maniatopiaPending', JSON.stringify(pending));
                localStorage.setItem('maniatopiaLast', word);
                target.textContent = word;
            } catch (e) {
                target.textContent = pick(words);
            }
        })();
    </script>

    <script>
        const audio = document.getElementById('bg-audio');
        const container = document.getElementById('gramofono-container');
        const img = document.getElementById('gramofono-img');
        const canvas = document.getElementById('gramofono-canvas');
        const ctx = canvas.getContext('2d');

        let isPlaying = false;

        const menuBtn = document.getElementById('menu-btn');
        const menuContainer = document.getElementById('menu-container');

        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isOpen = menuContainer.classList.toggle('is-open');
            menuBtn.setAttribute('aria-expanded', String(isOpen));
            menuBtn.setAttribute('aria-label', isOpen ? 'Cerrar menú de navegación' : 'Abrir menú de navegación');
            menuBtn.title = isOpen ? 'Cerrar menú de navegación' : 'Abrir menú de navegación';
        });

        window.addEventListener('click', () => {
            menuContainer.classList.remove('is-open');
            menuBtn.setAttribute('aria-expanded', 'false');
            menuBtn.setAttribute('aria-label', 'Abrir menú de navegación');
            menuBtn.title = 'Abrir menú de navegación';
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && menuContainer.classList.contains('is-open')) {
                menuContainer.classList.remove('is-open');
                menuBtn.setAttribute('aria-expanded', 'false');
                menuBtn.setAttribute('aria-label', 'Abrir menú de navegación');
                menuBtn.title = 'Abrir menú de navegación';
                menuBtn.focus();
            }
        });

        function togglePlay() {
            if (isPlaying) {
                audio.pause();
                isPlaying = false;

                canvas.width = 110;
                canvas.height = 110;
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                try {
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                } catch (e) {
                    console.log("Error al congelar fotograma:", e);
                }

                img.style.display = 'none';
                img.classList.remove('fast-heartbeat');
                canvas.style.display = 'block';
                canvas.classList.add('paused-style');
                container.setAttribute('title', 'Reanudar Música');
            } else {
                audio.play().then(() => {
                    isPlaying = true;
                    img.classList.remove('fast-heartbeat');
                    canvas.style.display = 'none';
                    img.style.display = 'block';
                    canvas.classList.remove('paused-style');
                    container.setAttribute('title', 'Pausar Música');
                }).catch(err => {
                    console.log("Audio bloqueado:", err);
                });
            }
        }

        container.addEventListener('click', togglePlay);

        window.addEventListener('DOMContentLoaded', () => {
            isPlaying = false;
            img.classList.add('fast-heartbeat');
        });
    </script>
</body>
</html>
