<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maniatopia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-image: url('fondo.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Cinzel', serif;
        }

        /* Contenedor Interactivo Principal */
        .interactive-widget {
            position: relative;
            width: 380px;
            height: 480px;
            cursor: pointer;
            transition: filter 0.6s ease, transform 0.3s ease;
        }

        .interactive-widget:hover {
            transform: scale(1.02);
        }

        /* Estado Pausado: Escala de grises y congelado */
        .interactive-widget.paused {
            filter: grayscale(100%) opacity(0.8);
        }

        .interactive-widget.paused * {
            animation-play-state: paused !important;
        }

        /* Ilustración SVG */
        .art-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* Disco en movimiento */
        .vinyl-record {
            transform-origin: 190px 285px;
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* Acuarela y Estallido Cromático */
        .watercolor-stain {
            mix-blend-mode: screen;
            opacity: 0.85;
            animation: watercolorPulse 4s ease-in-out infinite alternate;
        }

        @keyframes watercolorPulse {
            0% { transform: scale(0.98); opacity: 0.75; }
            100% { transform: scale(1.03); opacity: 0.95; }
        }

        /* Animación de Ondas y Elementos Flotantes */
        .floating-element {
            animation: floatAway 3.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
            opacity: 0;
        }

        .elem-1 { animation-delay: 0s; }
        .elem-2 { animation-delay: 0.7s; }
        .elem-3 { animation-delay: 1.4s; }
        .elem-4 { animation-delay: 2.1s; }
        .elem-5 { animation-delay: 2.8s; }

        @keyframes floatAway {
            0% {
                transform: translate(0, 0) scale(0.4) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            80% {
                opacity: 0.9;
            }
            100% {
                transform: translate(-90px, -140px) scale(1.2) rotate(25deg);
                opacity: 0;
            }
        }

        /* Reloj de Arena y Giro */
        .hourglass-group {
            transform-origin: 320px 340px;
            transition: transform 1.2s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        .hourglass-group.flip {
            transform: rotate(180deg);
        }

        .sand-stream {
            animation: streamFlow 0.6s linear infinite;
        }

        @keyframes streamFlow {
            0% { stroke-dashoffset: 0; }
            100% { stroke-dashoffset: 10; }
        }

        /* Indicador de Ayuda al Clic */
        .click-hint {
            position: absolute;
            bottom: -30px;
            width: 100%;
            text-align: center;
            color: #ffffff;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-shadow: 2px 2px 8px #000;
            opacity: 0.7;
            pointer-events: none;
            transition: opacity 0.4s;
        }
    </style>
</head>
<body>

    <!-- Contenedor Arte Interactivo -->
    <div class="interactive-widget paused" id="mainWidget" title="Haz clic para reproducir/pausar">
        <svg class="art-svg" viewBox="0 0 400 500">
            <defs>
                <!-- Filtro Estilo Acuarela -->
                <filter id="watercolor">
                    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
                    <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G" />
                </filter>

                <!-- Gradientes de Color Vibrante estilo Acuarela -->
                <linearGradient id="watercolorGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#ff0055" />
                    <stop offset="30%" stop-color="#ff5000" />
                    <stop offset="65%" stop-color="#ffcc00" />
                    <stop offset="100%" stop-color="#00e5ff" />
                </linearGradient>

                <linearGradient id="watercolorGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#9d00ff" />
                    <stop offset="50%" stop-color="#ff007f" />
                    <stop offset="100%" stop-color="#00ff66" />
                </linearGradient>
            </defs>

            <!-- 1. EXPLOSIÓN DE ACUARELA Y GOTAS ATRÁS -->
            <g filter="url(#watercolor)" class="watercolor-stain">
                <path d="M 110 180 Q 80 120 130 70 Q 180 30 230 80 Q 280 130 220 200 Q 160 250 110 180 Z" fill="url(#watercolorGrad1)" />
                <circle cx="90" cy="110" r="14" fill="#ff0055" />
                <circle cx="70" cy="140" r="8" fill="#ffcc00" />
                <circle cx="120" cy="50" r="10" fill="#00e5ff" />
                <circle cx="250" cy="60" r="16" fill="#9d00ff" />
                <circle cx="270" cy="100" r="7" fill="#00ff66" />
            </g>

            <!-- 2. BASE Y CAJA DE LA GRAMOLA (GRABADO MADERA CLASSIC) -->
            <g id="gramophone-base">
                <!-- Sombra -->
                <ellipse cx="190" cy="385" rx="100" ry="18" fill="rgba(0,0,0,0.5)" />
                
                <!-- Caja de Madera -->
                <polygon points="120,330 260,330 275,370 105,370" fill="#3d2314" stroke="#1a0f08" stroke-width="3" />
                <polygon points="105,370 275,370 275,380 105,380" fill="#24140b" stroke="#1a0f08" stroke-width="2" />
                <!-- Detalle dorado estilo grabado -->
                <rect x="135" y="340" width="110" height="20" rx="3" fill="#b8860b" stroke="#5c4008" stroke-width="2" />
                <path d="M 140 350 L 240 350" stroke="#fff8dc" stroke-width="1" opacity="0.6" />
            </g>

            <!-- 3. DISCO DE VINILO GIRATORIO -->
            <g class="vinyl-record">
                <ellipse cx="190" cy="285" rx="75" ry="22" fill="#111111" stroke="#333" stroke-width="1" />
                <ellipse cx="190" cy="285" rx="55" ry="16" fill="none" stroke="#222222" stroke-width="1.5" />
                <ellipse cx="190" cy="285" rx="35" ry="10" fill="none" stroke="#222222" stroke-width="1.5" />
                <ellipse cx="190" cy="285" rx="20" ry="6" fill="#cc0000" />
                <circle cx="190" cy="285" r="2" fill="#ffffff" />
            </g>

            <!-- 4. TUBA DE LA GRAMOLA (COMBINACIÓN GRABADO + ACUARELA) -->
            <g id="gramophone-horn">
                <path d="M 190 285 Q 230 270 220 220 Q 210 170 160 160 Q 130 155 150 110" fill="none" stroke="#b8860b" stroke-width="10" stroke-linecap="round" />
                
                <!-- Campana/Tuba de la Gramola estilo Grabado Vintage -->
                <path d="M 150 110 Q 110 70 80 100 Q 50 130 110 180 Q 150 200 170 160 Z" fill="none" stroke="#1a0f08" stroke-width="4" />
                
                <!-- Textura Grabado Líneas Tuba -->
                <path d="M 140 120 Q 95 105 85 125 M 145 135 Q 105 125 95 145 M 150 150 Q 115 145 105 160" fill="none" stroke="#3d2314" stroke-width="1.5" />
            </g>

            <!-- 5. ELEMENTOS FLOTANTES DE COLORES EN VIVO (MARIPOSAS, NOTAS, DRAGÓN, AVES) -->
            <g id="magical-particles">
                <!-- Mariposa Magenta/Amarilla -->
                <g class="floating-element elem-1" transform="translate(140, 110)">
                    <path d="M 0 0 C -15 -15 -20 5 0 10 C 20 5 15 -15 0 0 Z" fill="#ff007f" />
                    <path d="M 0 0 C -10 15 -15 20 0 10 C 15 20 10 15 0 0 Z" fill="#ffcc00" />
                    <circle cx="0" cy="2" r="1.5" fill="#fff" />
                </g>

                <!-- Mariposa Verde Neón / Azul -->
                <g class="floating-element elem-3" transform="translate(160, 90)">
                    <path d="M 0 0 C -18 -10 -15 -25 0 -5 C 15 -25 18 -10 0 0 Z" fill="#00ff66" />
                    <path d="M 0 0 C -12 12 -5 20 0 5 C 5 20 12 12 0 0 Z" fill="#00e5ff" />
                </g>

                <!-- Nota Musical Cian -->
                <g class="floating-element elem-2" transform="translate(130, 130)">
                    <text x="0" y="0" font-size="28" fill="#00e5ff" font-weight="bold">🎵</text>
                </g>

                <!-- Pajarillo Dorado -->
                <g class="floating-element elem-4" transform="translate(170, 70)">
                    <path d="M 0 0 Q 8 -12 16 -4 Q 10 4 0 0 Q -8 -8 -16 -2 Q -6 6 0 0 Z" fill="#ffdd00" />
                </g>

                <!-- Mini Dragón Púrpura -->
                <g class="floating-element elem-5" transform="translate(120, 100)">
                    <path d="M0,0 Q-10,-10 -5,-20 Q5,-15 0,0 Q10,5 15,-5 Q10,-20 0,0" fill="#9d00ff" />
                    <circle cx="-3" cy="-12" r="1.5" fill="#00ff66" />
                </g>
            </g>

            <!-- 6. RELOJ DE ARENA INTEGRADO Y SINCRONIZADO -->
            <g class="hourglass-group" id="hourglassGroup">
                <!-- Marco del Reloj -->
                <rect x="305" y="280" width="30" height="6" fill="#b8860b" rx="2" />
                <rect x="305" y="394" width="30" height="6" fill="#b8860b" rx="2" />
                <line x1="310" y1="286" x2="310" y2="394" stroke="#5c4008" stroke-width="3" />
                <line x1="330" y1="286" x2="330" y2="394" stroke="#5c4008" stroke-width="3" />

                <!-- Cristal del Reloj -->
                <path d="M 310 286 L 330 286 L 322 340 L 330 394 L 310 394 L 318 340 Z" fill="rgba(255, 255, 255, 0.2)" stroke="rgba(255, 255, 255, 0.6)" stroke-width="1.5" />

                <!-- Arena Superior (Se vacía) -->
                <path id="topSand" d="M 312 288 L 328 288 L 320 338 Z" fill="#ffcc00" />

                <!-- Chorro de Arena Caída -->
                <line id="sandStream" class="sand-stream" x1="320" y1="338" x2="320" y2="390" stroke="#ffcc00" stroke-width="1.5" stroke-dasharray="3,3" />

                <!-- Arena Inferior (Se llena) -->
                <path id="bottomSand" d="M 320 392 L 320 392 L 320 392 Z" fill="#ffcc00" />
            </g>
        </svg>

        <div class="click-hint" id="clickHint">Toca para escuchar</div>
    </div>

    <!-- Audio MP3 -->
    <audio id="bgAudio" loop preload="auto">
        <source src="bolero.mp3" type="audio/mpeg">
    </audio>

    <script>
        const widget = document.getElementById('mainWidget');
        const audio = document.getElementById('bgAudio');
        const clickHint = document.getElementById('clickHint');
        
        const topSand = document.getElementById('topSand');
        const bottomSand = document.getElementById('bottomSand');
        const sandStream = document.getElementById('sandStream');
        const hourglassGroup = document.getElementById('hourglassGroup');

        let isFlipping = false;

        // Intentar Reproducción Automática al Cargar
        window.addEventListener('DOMContentLoaded', () => {
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    setPlayingState(true);
                }).catch(() => {
                    // Si el navegador bloquea el autoplay, queda pausado esperando clic
                    setPlayingState(false);
                });
            }
        });

        // Alternar Play / Pause al hacer clic en el Arte
        widget.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                setPlayingState(true);
            } else {
                audio.pause();
                setPlayingState(false);
            }
        });

        function setPlayingState(isPlaying) {
            if (isPlaying) {
                widget.classList.remove('paused');
                clickHint.style.opacity = '0';
                sandStream.style.display = 'block';
            } else {
                widget.classList.add('paused');
                clickHint.style.opacity = '0.8';
                sandStream.style.display = 'none';
            }
        }

        // Sincronización del Reloj de Arena con la Canción
        audio.addEventListener('timeupdate', () => {
            if (!audio.duration || isFlipping) return;

            const progress = audio.currentTime / audio.duration; // De 0.0 a 1.0

            // 1. Vaciar triángulo superior
            const topY = 288 + (50 * progress);
            topSand.setAttribute('d', `M 312 ${topY} L 328 ${topY} L 320 338 Z`);

            // 2. Llenar base inferior
            const bottomY = 392 - (52 * progress);
            const bottomWidth = 8 * progress;
            bottomSand.setAttribute('d', `M ${320 - bottomWidth} 392 L ${320 + bottomWidth} 392 L 320 ${bottomY} Z`);

            // 3. Mecanismo al terminar la canción: Pausa 10s y Giro 180°
            if (progress >= 0.99 && !isFlipping) {
                handleHourglassLoop();
            }
        });

        function handleHourglassLoop() {
            isFlipping = true;
            sandStream.style.display = 'none'; // Detener flujo

            // Esperar 10 segundos de pausa al terminar
            setTimeout(() => {
                // Girar Reloj
                hourglassGroup.classList.add('flip');

                setTimeout(() => {
                    // Reiniciar valores de arena tras el giro
                    hourglassGroup.classList.remove('flip');
                    topSand.setAttribute('d', 'M 312 288 L 328 288 L 320 338 Z');
                    bottomSand.setAttribute('d', 'M 320 392 L 320 392 L 320 392 Z');
                    
                    audio.currentTime = 0;
                    audio.play();
                    sandStream.style.display = 'block';
                    isFlipping = false;
                }, 1200); // Duración de la animación de giro
            }, 10000); // 10 segundos de pausa
        }
    </script>
</body>
</html>
