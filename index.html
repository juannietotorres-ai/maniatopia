    <script>
        (function () {
            const counter = document.querySelector('.maniatopia-counter-container');
            const hideHint = function () { counter.classList.remove('is-pressed'); };
            const isActivationKey = function (event) { return event.key === 'Enter' || event.key === ' '; };
            counter.addEventListener('pointerdown', function () { counter.classList.add('is-pressed'); });
            counter.addEventListener('pointerup', hideHint);
            counter.addEventListener('pointercancel', hideHint);
            counter.addEventListener('keydown', function (event) {
                if (isActivationKey(event)) counter.classList.add('is-pressed');
            });
            counter.addEventListener('keyup', function (event) {
                if (isActivationKey(event)) hideHint();
            });
            counter.addEventListener('blur', hideHint);
        })();
    </script>

    <script>
        // Pon aquí tu código de GoatCounter (https://CODIGO.goatcounter.com). Vacío = muestra "---".
        (function () {
            const GC_CODE = 'jantorres';
            const el = document.getElementById('visitor-number');
            if (!GC_CODE || !el) return;
            const base = 'https://' + GC_CODE + '.goatcounter.com';
            const show = function () {
                fetch(base + '/counter/TOTAL.json')
                    .then(function (r) { return r.json(); })
                    .then(function (d) { el.textContent = String(d.count).replace(/\s/g, ','); })
                    .catch(function () {});
            };
            if (!sessionStorage.getItem('gc-counted')) {
                sessionStorage.setItem('gc-counted', '1');
                const s = document.createElement('script');
                s.async = true;
                s.src = 'https://gc.zgo.at/count.js';
                s.dataset.goatcounter = base + '/count';
                s.dataset.goatcounterSettings = JSON.stringify({ path: 'TOTAL' });
                s.onload = function () { setTimeout(show, 1200); };
                document.head.appendChild(s);
            } else {
                show();
            }
        })();
    </script>

    <script>
        // Primera visita absoluta: "CONSTRUYENDO". Después: palabra aleatoria sin repetir hasta agotar el ciclo.
        (function () {
            const words = ['CREANDO', 'COCINANDO', 'FILOSOFANDO', 'IMAGINANDO', 'DESCANSANDO', 'JUGANDO', 'FABRICANDO', 'EXPERIMENTANDO', 'EDIFICANDO', 'TERRAFORMANDO'];
            const target = document.getElementById('subtitle-word');
            const pick = (list) => list[Math.floor(Math.random() * list.length)];
            try {
                if (localStorage.getItem('maniatopiaVisited') !== '1') {
                    localStorage.setItem('maniatopiaVisited', '1');
                    return;
                }
                let pending = JSON.parse(localStorage.getItem('maniatopiaPending') || '[]')
                    .filter((w) => words.includes(w));
                const last = localStorage.getItem('maniatopiaLast');
                if (pending.length === 0) pending = words.slice();
                // Al empezar un ciclo nuevo, evita repetir la última palabra del anterior
                const options = pending.length === words.length && pending.length > 1
                    ? pending.filter((w) => w !== last)
                    : pending;
                const word = pick(options);
                pending.splice(pending.indexOf(word), 1);
                localStorage.setItem('maniatopiaPending', JSON.stringify(pending));
                localStorage.setItem('maniatopiaLast', word);
                target.textContent = word;
            } catch (e) {
                target.textContent = pick(words);
            }
        })();
    </script>

            menuContainer.classList.remove('is-open');
            menuBtn.setAttribute('aria-expanded', 'false');
            menuBtn.setAttribute('aria-label', 'Abrir menú de navegación');
            menuBtn.title = 'Abrir menú de navegación';
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && menuContainer.classList.contains('is-open')) {
                menuContainer.classList.remove('is-open');
                menuBtn.setAttribute('aria-expanded', 'false');
                menuBtn.setAttribute('aria-label', 'Abrir menú de navegación');
                menuBtn.title = 'Abrir menú de navegación';
                menuBtn.focus();
            }
        });

        function showPlaying() {
            img.classList.remove('fast-heartbeat');
            canvas.style.display = 'none';
            img.style.display = 'block';
            canvas.classList.remove('paused-style');
            container.setAttribute('title', 'Pausar Música');
        }

        function showPaused() {
            canvas.width = 110;
            canvas.height = 110;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            try {
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            } catch (e) {
                console.log("Error al congelar fotograma:", e);
            }

            img.style.display = 'none';
            img.classList.remove('fast-heartbeat');
            canvas.style.display = 'block';
            canvas.classList.add('paused-style');
            container.setAttribute('title', 'Reanudar Música');
        }

        // La interfaz sigue al estado real del audio, también cuando se retoma al llegar de otra página
        audio.addEventListener('play', showPlaying);
        window.addEventListener('maniatopia-music-state', () => {
            if (window.ManiatopiaMusic.isPlaying()) showPlaying();
            else showPaused();
        });

        container.addEventListener('click', () => {
            window.ManiatopiaMusic.toggle().catch(err => console.log("Audio bloqueado:", err));
        });

        window.addEventListener('DOMContentLoaded', () => {
            if (!window.ManiatopiaMusic.isPlaying()) {
                img.classList.add('fast-heartbeat');
            } else {
                showPlaying();
            }
        });
    </script>
</body>
</html>
