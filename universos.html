<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maniatopia - Refugio de Universos</title>
    <meta name="description" content="Refugio de Universos de Maniatopia: Shepherd y otros mundos de fantasía.">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="assets/Fonts-ttf/Merienda-VariableFont_wght.ttf" as="font" type="font/ttf" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Homemade+Apple&family=Special+Elite&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=GFS+Didot&display=swap" rel="stylesheet">
    <script>
        if (document.fonts && document.fonts.load) {
            document.documentElement.classList.add('title-font-loading');
        }
    </script>
    <style>
        @font-face {
            font-family: 'Fredericka the Great';
            src: url('assets/Fonts-ttf/FrederickatheGreat-Regular.ttf') format('truetype');
            font-style: normal;
            font-weight: 400;
            font-display: swap;
        }

        @font-face {
            font-family: 'Merienda';
            src: url('assets/Fonts-ttf/Merienda-VariableFont_wght.ttf') format('truetype');
            font-style: normal;
            font-weight: 300 900;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: url('assets/images/fondo-maniatopia.jpg') no-repeat left center fixed;
            background-size: cover;
            overflow: hidden;
        }

        .page-title {
            padding: clamp(18px, 3vw, 36px) 16px 0;
            color: #fff;
            font: 400 clamp(1.75rem, 7vw, 5.5rem)/1.15 'Merienda', cursive;
            text-align: center;
            text-shadow: 0 2px 6px #000, 0 0 12px rgba(0, 0, 0, 0.8);
        }

        .title-font-loading .page-title {
            visibility: hidden;
        }

        .shepherd-logo {
            display: block;
            width: fit-content;
            margin: clamp(16px, 2vw, 28px) 0 0 clamp(56px, 8vw, 110px);
            transition: transform 0.25s ease, filter 0.25s ease;
        }

        .shepherd-logo span {
            display: block;
            width: clamp(150px, 22vw, 300px);
            aspect-ratio: 1;
            background: url('assets/images/logo-Jan.png') center / contain no-repeat;
        }

        .shepherd-logo:hover,
        .shepherd-logo:focus-visible {
            transform: scale(1.05);
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.6));
        }

        .friends-link {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 210px;
            height: 210px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font: 400 clamp(1.8rem, 3vw, 2.5rem)/1.05 'Merienda', cursive;
            text-align: center;
            text-decoration: none;
            text-shadow: 0 2px 6px #000, 0 0 12px rgba(255, 255, 255, 0.55);
            transition: transform 250ms ease, text-shadow 250ms ease;
        }

        .friends-link:hover,
        .friends-link:focus-visible {
            transform: scale(1.05);
            text-shadow: 0 2px 6px #000, 0 0 18px rgba(255, 255, 255, 0.9);
        }

        .friends-link:focus-visible {
            outline: 2px solid #fff;
            outline-offset: -8px;
        }

        /* --- MENÚ DESPLEGABLE --- */
        #menu-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 210px;
            height: 210px;
            z-index: 2000;
            perspective: 1100px;
        }

        #menu-btn {
            background: url('assets/images/puerta botonera.png') center / contain no-repeat;
            border: 0;
            padding: 0;
            appearance: none;
            position: absolute;
            bottom: 0;
            left: 0;
            width: 210px;
            height: 210px;
            z-index: 2;
            cursor: pointer;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.7));
            transform-origin: left bottom;
            transition: transform 900ms cubic-bezier(0.2, 0.75, 0.25, 1), opacity 700ms ease, filter 700ms ease;
        }

        #menu-btn:hover {
            transform: scale(1.05);
        }

        #menu-btn:focus-visible {
            outline: 3px solid #e0c090;
            outline-offset: 6px;
        }

        #menu-dropdown {
            position: absolute;
            bottom: 0;
            left: 0;
            width: min(86vw, 680px);
            height: min(76vh, 620px);
            min-height: 280px;
            z-index: 1;
            background: radial-gradient(ellipse at 28% 72%, #101018 0%, #050508 64%);
            border-radius: 24px 120px 22px 22px;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.9), inset 0 0 45px rgba(25, 34, 55, 0.25);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            clip-path: polygon(0 100%, 0 100%, 0 100%);
            transform: scale(0.2);
            transform-origin: left bottom;
            transition: clip-path 850ms cubic-bezier(0.2, 0.75, 0.25, 1), transform 800ms cubic-bezier(0.2, 0.75, 0.25, 1), opacity 450ms ease, visibility 0s linear 850ms;
        }

        #menu-container.is-open #menu-dropdown {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            clip-path: polygon(0 100%, 0 15%, 14% 0, 100% 0, 100% 100%);
            transform: scale(1);
            transition: clip-path 850ms cubic-bezier(0.2, 0.75, 0.25, 1), transform 800ms cubic-bezier(0.2, 0.75, 0.25, 1), opacity 450ms ease, visibility 0s;
        }

        #menu-container.is-open #menu-btn {
            transform: translate(190px, -135px) scale(2.5) rotate(8deg) rotateY(-38deg);
            opacity: 0.28;
            filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.9));
        }

        #menu-dropdown a {
            position: absolute;
            z-index: 3;
            display: inline-flex;
            align-items: center;
            width: max-content;
            max-width: calc(100% - 48px);
            text-decoration: none;
            opacity: 0;
            transform: translateY(22px) scale(0.92);
            transition: opacity 400ms ease, transform 500ms cubic-bezier(0.2, 0.75, 0.25, 1), filter 250ms ease;
        }

        #menu-container.is-open #menu-dropdown a {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        #menu-dropdown .nav-home {
            left: 48px;
            top: 10%;
            transition-delay: 180ms;
        }

        .home-icon {
            width: 68px;
            height: 68px;
            fill: none;
            stroke: #f4c76b;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 10px rgba(255, 195, 86, 0.75));
            transition: transform 250ms ease, filter 250ms ease;
        }

        #menu-dropdown .nav-home:hover .home-icon,
        #menu-dropdown .nav-home:focus-visible .home-icon {
            transform: scale(1.16) rotate(-5deg);
            filter: drop-shadow(0 0 18px rgba(255, 221, 130, 1));
        }

        #menu-dropdown .nav-location {
            left: 34px;
            top: 28%;
            font-family: 'Fredericka the Great', cursive;
            font-size: clamp(1.6rem, 3.6vw, 2.35rem);
            letter-spacing: 0;
            white-space: nowrap;
            background: linear-gradient(110deg, #ff4b08, #ff8a18, #ffc04a, #ff5a0a, #ff4b08);
            background-size: 250% 100%;
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 9px rgba(255, 91, 8, 0.7));
            animation: fireFlow 6s ease-in-out infinite alternate;
            transition-delay: 300ms;
        }

        #menu-dropdown .nav-location:hover,
        #menu-dropdown .nav-location:focus-visible {
            filter: drop-shadow(0 0 17px rgba(255, 151, 34, 1));
            transform: translateY(-2px) scale(1.06);
        }

        #menu-dropdown .nav-universes {
            left: 40px;
            top: 46%;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: clamp(1.05rem, 2.3vw, 1.55rem);
            letter-spacing: 3px;
            text-transform: uppercase;
            white-space: nowrap;
            background: linear-gradient(110deg, #7b5cff, #3fd0ff, #d86bff, #6a8cff, #7b5cff);
            background-size: 250% 100%;
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 8px rgba(120, 130, 255, 0.75));
            animation: cosmicFlow 7s ease-in-out infinite alternate;
            transition-delay: 360ms;
        }

        #menu-dropdown .nav-universes:hover,
        #menu-dropdown .nav-universes:focus-visible {
            filter: drop-shadow(0 0 16px rgba(120, 220, 255, 1));
            transform: translateY(-2px) scale(1.06);
        }

        #menu-dropdown .nav-contact {
            left: 48px;
            top: 79%;
            font-family: 'Special Elite', monospace;
            font-size: clamp(1.35rem, 2.8vw, 2rem);
            letter-spacing: 2px;
            color: #d7e9ff;
            text-shadow: 0 0 12px rgba(119, 181, 255, 0.75);
            transition-delay: 420ms;
        }

        #menu-dropdown .nav-contact:hover,
        #menu-dropdown .nav-contact:focus-visible {
            color: #ffffff;
            text-shadow: 0 0 20px rgba(136, 202, 255, 1);
            transform: translateY(-2px) scale(1.06);
        }

        @keyframes fireFlow {
            from { background-position: 0% 50%; }
            to { background-position: 100% 50%; }
        }

        @keyframes cosmicFlow {
            from { background-position: 0% 50%; }
            to { background-position: 100% 50%; }
        }

        /* --- MÓVIL --- */
        @media (max-width: 768px) {
            #menu-container { bottom: 15px; left: 8px; width: 175px; height: 175px; }
            #menu-btn { width: 175px; height: 175px; }
            #menu-container:not(.is-open) #menu-btn { width: 131.25px; height: 131.25px; }
            .friends-link { right: 8px; bottom: 15px; width: 131.25px; height: 131.25px; font-size: 1.65rem; }
            #menu-dropdown { width: min(88vw, 480px); height: min(76vh, 620px); min-height: 260px; }
            #menu-container.is-open #menu-btn { transform: translate(115px, -105px) scale(2.5) rotate(7deg) rotateY(-35deg); }
            #menu-dropdown .nav-home { left: 28px; }
            #menu-dropdown .nav-location { left: 24px; font-size: clamp(1.25rem, 5.3vw, 1.85rem); }
            #menu-dropdown .nav-universes { left: 28px; font-size: clamp(0.95rem, 4.2vw, 1.3rem); letter-spacing: 2px; }
            #menu-dropdown .nav-contact { left: 32px; font-size: clamp(1.2rem, 5vw, 1.65rem); }
            .home-icon { width: 58px; height: 58px; }
            body { background-size: auto 90%; background-position: 30% center; background-color: #03030a; }
        }

        @media (prefers-reduced-motion: reduce) {
            #menu-btn, #menu-dropdown, #menu-dropdown a, .home-icon, .friends-link { transition-duration: 0.01ms; }
            #menu-dropdown .nav-location, #menu-dropdown .nav-universes { animation: none; }
        }
    </style>
    <link rel="stylesheet" href="assets/agora-menu.css?v=20261106-3">
    <link rel="stylesheet" href="assets/tooltip.css">
    <script defer src="assets/tooltip.js"></script>
</head>
<body>
    <h1 class="page-title">Universos GeoSoberanos</h1>
    <a class="shepherd-logo" href="janspace.html" aria-label="Ir a Jan Space" data-help="Ir a Jan Space">
        <span role="img" aria-label="Jan"></span>
    </a>
    <a class="friends-link" href="universos-amigos.html" aria-label="Ir a Universos Amigos" data-help="Ir a Universos Amigos">Universos<br>Amigos</a>

    <!-- MENÚ DESPLEGABLE -->
    <div id="menu-container">
        <button id="menu-btn" type="button" data-help="Menú de navegación" aria-label="Abrir menú de navegación" aria-controls="menu-dropdown" aria-expanded="false"></button>
        <div id="menu-dropdown">
            <a class="nav-home" href="index.html" aria-label="Inicio" data-help="Inicio">
                <svg class="home-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 10.5 12 3l9 7.5M5.5 9.5V21h13V9.5M9 21v-7h6v7"></path>
                </svg>
            </a>
            <a class="nav-location" href="donde-estoy.html">¿Dónde estoy?</a>
            <a class="nav-universes" href="universos.html">Refugio de Universos</a>
            <a class="nav-symposion" href="https://discord.gg/RnQvtGRNmj" target="_blank" rel="noopener noreferrer"><span class="agora-steel">Ágora Eleúthera</span> <span class="greek" lang="el">ευθέρα ἀγορά</span></a>
            <a class="nav-contact" href="contacto.html">Contacto</a>
        </div>
    </div>

    <script>
        if (document.fonts && document.fonts.load) {
            document.documentElement.classList.add('title-font-loading');
            document.fonts.load('400 1em "Merienda"').then(() => {
                document.documentElement.classList.remove('title-font-loading');
            }, (error) => {
                console.error('No se pudo cargar la fuente del título:', error);
                document.documentElement.classList.remove('title-font-loading');
            });
        }

        const menuBtn = document.getElementById('menu-btn');
        const menuContainer = document.getElementById('menu-container');

        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isOpen = menuContainer.classList.toggle('is-open');
            menuBtn.setAttribute('aria-expanded', String(isOpen));
            menuBtn.setAttribute('aria-label', isOpen ? 'Cerrar menú de navegación' : 'Abrir menú de navegación');
            menuBtn.dataset.help = isOpen ? 'Cerrar menú de navegación' : 'Abrir menú de navegación';
        });

        window.addEventListener('click', () => {
            menuContainer.classList.remove('is-open');
            menuBtn.setAttribute('aria-expanded', 'false');
            menuBtn.setAttribute('aria-label', 'Abrir menú de navegación');
            menuBtn.dataset.help = 'Abrir menú de navegación';
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && menuContainer.classList.contains('is-open')) {
                menuContainer.classList.remove('is-open');
                menuBtn.setAttribute('aria-expanded', 'false');
                menuBtn.setAttribute('aria-label', 'Abrir menú de navegación');
                menuBtn.dataset.help = 'Abrir menú de navegación';
                menuBtn.focus();
            }
        });
    </script>
    <script src="musica.js"></script>
</body>
</html>
