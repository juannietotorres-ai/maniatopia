<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maniatopia - Reloj de Arena Artístico y Onírico</title>
    <style>
        body {
            background-color: #0b0805;
            color: #e0c090;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: serif;
        }

        #controls {
            margin-bottom: 20px;
        }

        button {
            background: #2a1a08;
            color: #e0c090;
            border: 1px solid #e0c090;
            padding: 8px 16px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.3s;
        }

        button:hover {
            background: #4a3011;
        }

        #canvas-wrapper {
            padding: 20px;
            background: radial-gradient(circle, rgba(35,22,12,0.8) 0%, rgba(5,5,5,0.95) 100%);
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.95);
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <div id="controls">
        <button id="toggle-btn">Estado: PLAY (Onírico & Fluido)</button>
    </div>

    <div id="canvas-wrapper">
        <canvas id="reloj-canvas" width="180" height="260"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('reloj-canvas');
        const ctx = canvas.getContext('2d');
        const btn = document.getElementById('toggle-btn');

        let isPlaying = true;
        let tiempo = 0;
        let progreso = 0.35;

        btn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            btn.innerText = isPlaying ? "Estado: PLAY (Onírico & Fluido)" : "Estado: PAUSA (Arena Estática)";
        });

        function dibujarSoporteMadera() {
            const gradMadera = ctx.createLinearGradient(20, 0, 160, 0);
            gradMadera.addColorStop(0, '#150a03');
            gradMadera.addColorStop(0.25, '#3d230b');
            gradMadera.addColorStop(0.5, '#5c3713');
            gradMadera.addColorStop(0.75, '#3d230b');
            gradMadera.addColorStop(1, '#150a03');

            // Tapa Superior con bisel de calidad
            ctx.fillStyle = gradMadera;
            ctx.beginPath();
            ctx.roundRect(15, 10, 150, 16, 6);
            ctx.fill();
            ctx.strokeStyle = '#e0c090';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Tapa Inferior
            ctx.beginPath();
            ctx.roundRect(15, 234, 150, 16, 6);
            ctx.fill();
            ctx.stroke();

            // Soportes / Columnas con relieve
            ctx.lineWidth = 8;
            ctx.strokeStyle = gradMadera;
            ctx.beginPath();
            ctx.moveTo(24, 26);
            ctx.lineTo(24, 234);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(156, 26);
            ctx.lineTo(156, 234);
            ctx.stroke();
        }

        function obtenerColorCaotico(y, t) {
            if (!isPlaying) return '#dfc299'; // Pausa: Arena fina clásica
            // Mezcla rápida, caótica y mutante (Cúpula Superior - Daliniana)
            const r = Math.floor(200 + 55 * Math.sin(y * 0.15 + t * 0.3));
            const g = Math.floor(100 + 70 * Math.cos(y * 0.1 - t * 0.2));
            const b = Math.floor(50 + 90 * Math.sin(t * 0.3));
            return `rgb(${r},${g},${b})`;
        }

        function obtenerColorDenso(y, t) {
            if (!isPlaying) return '#d4b585'; // Pausa: Arena fina clásica
            // Mezcla lenta, pesada y melancólica (Cúpula Inferior)
            const r = Math.floor(150 + 40 * Math.sin(y * 0.04 + t * 0.05));
            const g = Math.floor(60 + 30 * Math.cos(y * 0.05 - t * 0.04));
            const b = Math.floor(80 + 40 * Math.sin(t * 0.06));
            return `rgb(${r},${g},${b})`;
        }

        function dibujarMasasYCristal() {
            // --- CÚPULA SUPERIOR (Masa Onírica Caótica) ---
            const altoSup = 26 + (125 - 26) * progreso;
            if (altoSup < 125) {
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(35, altoSup);
                ctx.lineTo(145, altoSup);
                ctx.quadraticCurveTo(125, 90, 91, 128);
                ctx.quadraticCurveTo(55, 90, 35, altoSup);
                ctx.clip();

                for (let yDraw = altoSup; yDraw <= 128; yDraw += 3) {
                    ctx.fillStyle = obtenerColorCaotico(yDraw, tiempo);
                    ctx.beginPath();
                    let onda = Math.sin(yDraw * 0.25 + tiempo * 0.4) * 5;
                    ctx.arc(90 + onda, yDraw, 4.5, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            // --- CÚPULA INFERIOR (Masa Densa Derretida) ---
            const altoInf = 234 - (234 - 145) * progreso;
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(28, 234);
            ctx.lineTo(152, 234);
            ctx.lineTo(145, altoInf);
            ctx.quadraticCurveTo(90, altoInf - (8 * Math.sin(tiempo * 0.04)), 35, altoInf);
            ctx.closePath();
            ctx.clip();

            for (let yDraw = altoInf; yDraw <= 234; yDraw += 4) {
                ctx.fillStyle = obtenerColorDenso(yDraw, tiempo * 0.2);
                ctx.fillRect(25, yDraw, 130, 5);
            }
            ctx.restore();

            // --- CHORRO CENTRAL DE FUSIÓN ---
            if (isPlaying) {
                ctx.strokeStyle = obtenerColorCaotico(100, tiempo * 2);
                ctx.lineWidth = 3.5;
                ctx.beginPath();
                let wobble = Math.sin(tiempo * 0.5) * 2.5;
                ctx.moveTo(90 + wobble, 128);
                ctx.lineTo(90 - wobble, altoInf);
                ctx.stroke();
            }

            // --- CRISTAL Y EFECTOS DE CALIDAD (BRILLOS Y REFLEJOS REALISTAS) ---
            // Relleno interior traslúcido del vidrio
            ctx.fillStyle = 'rgba(255, 255, 255, 0.02)';
            ctx.beginPath();
            ctx.moveTo(30, 26);
            ctx.lineTo(150, 26);
            ctx.quadraticCurveTo(125, 90, 91, 128);
            ctx.quadraticCurveTo(125, 170, 150, 234);
            ctx.lineTo(30, 234);
            ctx.quadraticCurveTo(55, 170, 57, 128);
            ctx.quadraticCurveTo(55, 90, 30, 26);
            ctx.fill();

            // Reflejo de luz izquierdo (Brillo difuminado elegante)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
            ctx.lineWidth = 3;
            ctx.shadowBlur = 12;
            ctx.shadowColor = 'rgba(255, 255, 255, 0.6)';

            // Curva de luz cúpula superior
            ctx.beginPath();
            ctx.arc(90, 75, 38, Math.PI * 0.82, Math.PI * 1.05);
            ctx.stroke();

            // Curva de luz cúpula inferior
            ctx.beginPath();
            ctx.arc(90, 185, 38, Math.PI * 0.95, Math.PI * 1.18);
            ctx.stroke();

            ctx.shadowBlur = 0; // Limpiar sombra

            // Contorno estructural de cuarzo del reloj
            ctx.strokeStyle = 'rgba(224, 192, 144, 0.6)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function animar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (isPlaying) {
                tiempo += 0.6;
                progreso += 0.0003;
                if (progreso > 0.95) progreso = 0.05;
            }

            dibujarSoporteMadera();
            dibujarMasasYCristal();

            requestAnimationFrame(animar);
        }

        animar();
    </script>
</body>
</html>
