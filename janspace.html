<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maniatopia - Refugio de Universos</title>
    <meta name="description" content="Refugio de Universos de Maniatopia: Shepherd y otros mundos de fantasía.">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Homemade+Apple&family=Special+Elite&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=GFS+Didot&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Fredericka the Great';
            src: url('assets/Fonts-ttf/FrederickatheGreat-Regular.ttf') format('truetype');
            font-style: normal;
            font-weight: 400;
            font-display: swap;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: url('assets/images/fondo-maniatopia.jpg') no-repeat left center fixed;
            background-size: cover;
            overflow: hidden;
        }

        .shepherd-logo {
            position: absolute;
            top: clamp(56px, 8vw, 110px);
            left: clamp(56px, 8vw, 110px);
            display: block;
            transition: transform 0.25s ease, filter 0.25s ease;
        }

        /* La imagen tiene mucho margen transparente: se recorta al área del logo */
        .shepherd-logo span {
            display: block;
            width: clamp(255px, 36vw, 510px);
            aspect-ratio: 760 / 305;
            background: url('assets/images/ShepherdLogo.png') no-repeat;
            background-size: 180.26% auto;
            background-position: 50.8% 10.8%;
        }

        .shepherd-logo:hover,
        .shepherd-logo:focus-visible {
            transform: scale(1.05);
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.6));
        }

        .jan-box-button {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 210px;
            height: 210px;
            border: 0;
            padding: 0;
            background: url('assets/images/Cajon de Sastre Jan.png') center bottom / contain no-repeat;
            cursor: pointer;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.7));
            transition: transform 250ms ease, filter 250ms ease;
        }

        .jan-box-button:hover,
        .jan-box-button:focus-visible {
            transform: scale(1.05);
            filter: drop-shadow(0 0 10px rgba(255, 220, 150, 0.8));
        }

        .jan-box-button:focus-visible,
        .jan-terminal-close:focus-visible,
        .jan-terminal-power:focus-visible,
        .jan-terminal-input:focus-visible {
            outline: 3px solid #e0c090;
            outline-offset: 3px;
        }

        .jan-terminal {
            position: fixed;
            inset: 0;
            margin: auto;
            width: min(92vw, 700px, 80vh);
            width: min(92vw, 700px, 80dvh);
            max-width: none;
            max-height: 90vh;
            max-height: 90dvh;
            padding: 0;
            overflow: visible;
            border: 0;
            background: transparent;
            color: #8dff9f;
            font: 1rem/1.5 "Courier New", monospace;
        }

        .jan-terminal[open] {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .jan-monitor {
            position: relative;
            display: flex;
            flex-direction: column;
            width: 100%;
            aspect-ratio: 1.15;
            padding: clamp(16px, 3vw, 28px);
            padding-bottom: clamp(26px, 4vw, 38px);
            border: 4px solid #a89d88;
            border-radius: 8% / 7%;
            background: linear-gradient(135deg, #f4efdf 0%, #dfd6c3 38%, #c1b49c 100%);
            box-shadow: inset 3px 3px 4px #fffdf1, inset -6px -8px 8px #9d907a, 0 14px 0 -7px #887c69, 0 20px 35px rgba(0, 0, 0, 0.85);
        }

        .jan-terminal-screen {
            display: flex;
            flex: 1;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
            border: clamp(6px, 1.3vw, 12px) solid #53554a;
            border-radius: 8% / 10%;
            background:
                repeating-linear-gradient(to bottom, transparent 0 2px, rgba(0, 0, 0, 0.18) 3px 4px),
                radial-gradient(ellipse at center, #102417, #030a05 85%);
            text-shadow: 0 0 5px rgba(72, 255, 108, 0.45);
            box-shadow: 0 0 0 3px #ada28e, inset 0 0 35px rgba(0, 0, 0, 0.85);
        }

        .jan-monitor-stand {
            flex: none;
            width: 38%;
            height: clamp(16px, 3vw, 26px);
            border: 2px solid #a89d88;
            border-top: 0;
            border-radius: 0 0 50% 50% / 0 0 70% 70%;
            background: linear-gradient(to bottom, #9d907a, #e1d8c6 65%, #b8ab94);
            box-shadow: inset 0 -3px 4px #a59882, 0 3px 5px rgba(0, 0, 0, 0.4);
        }

        .jan-computer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: clamp(10px, 3vw, 28px);
            width: 96%;
            min-height: clamp(72px, 14vw, 110px);
            padding: 10px clamp(14px, 3vw, 30px);
            border: 3px solid #a89d88;
            border-radius: 5px 5px 10px 10px;
            background: linear-gradient(#eee8d8, #d5cbb7 70%, #b4a58c);
            box-shadow: inset 2px 2px 3px #fffdf1, inset -3px -4px 4px #a0927d, 0 9px 18px rgba(0, 0, 0, 0.75);
        }

        .jan-floppy-drive {
            display: flex;
            flex: 0 1 270px;
            flex-direction: column;
            justify-content: center;
            gap: 6px;
            min-width: 0;
            padding: 8px 10px 5px;
            border: 2px solid #958974;
            border-radius: 3px;
            background: linear-gradient(#d6ccba, #b8aa94);
            box-shadow: inset 1px 2px 4px #8b7e6a, 1px 1px 1px #f4eddd;
        }

        .jan-floppy-slot {
            height: 7px;
            border-radius: 2px;
            background: #302d29;
            box-shadow: inset 0 2px 3px #090908, 0 1px #e6decd;
        }

        .jan-floppy-label {
            color: #514d46;
            font: bold 0.6rem/1 Arial, sans-serif;
            text-align: right;
            white-space: nowrap;
        }

        .jan-terminal-power {
            width: 52px;
            height: 44px;
            flex: none;
            border: 3px outset #ddd3bf;
            border-radius: 3px;
            background: linear-gradient(#e9e1d1, #b9ad96);
            color: #39352d;
            font: bold 0.65rem Arial, sans-serif;
            cursor: pointer;
            box-shadow: 1px 2px 2px rgba(0, 0, 0, 0.45);
        }

        .jan-terminal-power:active {
            border-style: inset;
            transform: translateY(1px);
        }

        .jan-terminal-brand {
            position: absolute;
            right: clamp(20px, 4vw, 40px);
            bottom: 8px;
            color: #514d46;
            text-align: right;
            font: bold 0.8rem/1.2 Arial, sans-serif;
            letter-spacing: 0.04em;
        }

        .jan-terminal::backdrop {
            background: rgba(0, 0, 0, 0.75);
        }

        .jan-terminal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.75rem 1rem 0;
        }

        .jan-terminal-header h2 {
            font: bold 1rem/1.3 "Courier New", monospace;
        }

        .jan-terminal-close {
            flex: none;
            width: 2rem;
            height: 2rem;
            border: 1px solid #61be75;
            background: transparent;
            color: inherit;
            font: bold 1.25rem/1 "Courier New", monospace;
            cursor: pointer;
        }

        .jan-terminal-close:hover {
            background: #1b4825;
        }

        .jan-terminal-content {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 1rem;
        }

        .jan-terminal-prompt {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0 1rem 1rem;
        }

        .jan-terminal-input {
            flex: 1;
            min-width: 0;
            border: 0;
            padding: 0.4rem 0;
            background: transparent;
            color: inherit;
            caret-color: #8dff9f;
            text-shadow: inherit;
            font: inherit;
        }

        .jan-terminal-help {
            padding: 0 1rem 1rem;
        }

        @media (max-width: 500px) and (max-height: 500px) {
            .jan-terminal { font-size: 0.875rem; }
            .jan-terminal-header { padding: 0.5rem 0.5rem 0; }
            .jan-terminal-header h2 { font-size: 0.875rem; }
            .jan-terminal-content { padding: 0.5rem; }
            .jan-terminal-prompt { padding: 0 0.5rem 0.5rem; }
            .jan-terminal-help { padding: 0 0.5rem 0.5rem; }
        }

        /* --- MENÚ DESPLEGABLE --- */
        #menu-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 210px;
            height: 210px;
            z-index: 2000;
            perspective: 1100px;
        }

        #menu-btn {
            background: url('assets/images/puerta botonera.png') center / contain no-repeat;
            border: 0;
            padding: 0;
            appearance: none;
            position: absolute;
            bottom: 0;
            left: 0;
            width: 210px;
            height: 210px;
            z-index: 2;
            cursor: pointer;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.7));
            transform-origin: left bottom;
            transition: transform 900ms cubic-bezier(0.2, 0.75, 0.25, 1), opacity 700ms ease, filter 700ms ease;
        }

        #menu-btn:hover {
            transform: scale(1.05);
        }

        #menu-btn:focus-visible {
            outline: 3px solid #e0c090;
            outline-offset: 6px;
        }

        #menu-dropdown {
            position: absolute;
            bottom: 0;
            left: 0;
            width: min(86vw, 680px);
            height: min(76vh, 620px);
            min-height: 280px;
            z-index: 1;
            background: radial-gradient(ellipse at 28% 72%, #101018 0%, #050508 64%);
            border-radius: 24px 120px 22px 22px;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.9), inset 0 0 45px rgba(25, 34, 55, 0.25);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            clip-path: polygon(0 100%, 0 100%, 0 100%);
            transform: scale(0.2);
            transform-origin: left bottom;
            transition: clip-path 850ms cubic-bezier(0.2, 0.75, 0.25, 1), transform 800ms cubic-bezier(0.2, 0.75, 0.25, 1), opacity 450ms ease, visibility 0s linear 850ms;
        }

        #menu-container.is-open #menu-dropdown {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            clip-path: polygon(0 100%, 0 15%, 14% 0, 100% 0, 100% 100%);
            transform: scale(1);
            transition: clip-path 850ms cubic-bezier(0.2, 0.75, 0.25, 1), transform 800ms cubic-bezier(0.2, 0.75, 0.25, 1), opacity 450ms ease, visibility 0s;
        }

        #menu-container.is-open #menu-btn {
            transform: translate(190px, -135px) scale(2.5) rotate(8deg) rotateY(-38deg);
            opacity: 0.28;
            filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.9));
        }

        #menu-dropdown a {
            position: absolute;
            z-index: 3;
            display: inline-flex;
            align-items: center;
            width: max-content;
            max-width: calc(100% - 48px);
            text-decoration: none;
            opacity: 0;
            transform: translateY(22px) scale(0.92);
            transition: opacity 400ms ease, transform 500ms cubic-bezier(0.2, 0.75, 0.25, 1), filter 250ms ease;
        }

        #menu-container.is-open #menu-dropdown a {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        #menu-dropdown .nav-home {
            left: 48px;
            top: 10%;
            transition-delay: 180ms;
        }

        .home-icon {
            width: 68px;
            height: 68px;
            fill: none;
            stroke: #f4c76b;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 10px rgba(255, 195, 86, 0.75));
            transition: transform 250ms ease, filter 250ms ease;
        }

        #menu-dropdown .nav-home:hover .home-icon,
        #menu-dropdown .nav-home:focus-visible .home-icon {
            transform: scale(1.16) rotate(-5deg);
            filter: drop-shadow(0 0 18px rgba(255, 221, 130, 1));
        }

        #menu-dropdown .nav-location {
            left: 34px;
            top: 28%;
            font-family: 'Fredericka the Great', cursive;
            font-size: clamp(1.6rem, 3.6vw, 2.35rem);
            letter-spacing: 0;
            white-space: nowrap;
            background: linear-gradient(110deg, #ff4b08, #ff8a18, #ffc04a, #ff5a0a, #ff4b08);
            background-size: 250% 100%;
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 9px rgba(255, 91, 8, 0.7));
            animation: fireFlow 6s ease-in-out infinite alternate;
            transition-delay: 300ms;
        }

        #menu-dropdown .nav-location:hover,
        #menu-dropdown .nav-location:focus-visible {
            filter: drop-shadow(0 0 17px rgba(255, 151, 34, 1));
            transform: translateY(-2px) scale(1.06);
        }

        #menu-dropdown .nav-universes {
            left: 40px;
            top: 46%;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: clamp(1.05rem, 2.3vw, 1.55rem);
            letter-spacing: 3px;
            text-transform: uppercase;
            white-space: nowrap;
            background: linear-gradient(110deg, #7b5cff, #3fd0ff, #d86bff, #6a8cff, #7b5cff);
            background-size: 250% 100%;
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 8px rgba(120, 130, 255, 0.75));
            animation: cosmicFlow 7s ease-in-out infinite alternate;
            transition-delay: 360ms;
        }

        #menu-dropdown .nav-universes:hover,
        #menu-dropdown .nav-universes:focus-visible {
            filter: drop-shadow(0 0 16px rgba(120, 220, 255, 1));
            transform: translateY(-2px) scale(1.06);
        }

        #menu-dropdown .nav-contact {
            left: 48px;
            top: 79%;
            font-family: 'Special Elite', monospace;
            font-size: clamp(1.35rem, 2.8vw, 2rem);
            letter-spacing: 2px;
            color: #d7e9ff;
            text-shadow: 0 0 12px rgba(119, 181, 255, 0.75);
            transition-delay: 420ms;
        }

        #menu-dropdown .nav-contact:hover,
        #menu-dropdown .nav-contact:focus-visible {
            color: #ffffff;
            text-shadow: 0 0 20px rgba(136, 202, 255, 1);
            transform: translateY(-2px) scale(1.06);
        }

        @keyframes fireFlow {
            from { background-position: 0% 50%; }
            to { background-position: 100% 50%; }
        }

        @keyframes cosmicFlow {
            from { background-position: 0% 50%; }
            to { background-position: 100% 50%; }
        }

        /* --- MÓVIL --- */
        @media (max-width: 768px) {
            .jan-box-button { right: 8px; bottom: 15px; width: 131.25px; height: 131.25px; }
            #menu-container { bottom: 15px; left: 8px; width: 175px; height: 175px; }
            #menu-btn { width: 175px; height: 175px; }
            #menu-container:not(.is-open) #menu-btn { width: 131.25px; height: 131.25px; }
            #menu-dropdown { width: min(88vw, 480px); height: min(76vh, 620px); min-height: 260px; }
            #menu-container.is-open #menu-btn { transform: translate(115px, -105px) scale(2.5) rotate(7deg) rotateY(-35deg); }
            #menu-dropdown .nav-home { left: 28px; }
            #menu-dropdown .nav-location { left: 24px; font-size: clamp(1.25rem, 5.3vw, 1.85rem); }
            #menu-dropdown .nav-universes { left: 28px; font-size: clamp(0.95rem, 4.2vw, 1.3rem); letter-spacing: 2px; }
            #menu-dropdown .nav-contact { left: 32px; font-size: clamp(1.2rem, 5vw, 1.65rem); }
            .home-icon { width: 58px; height: 58px; }
            body { background-size: auto 90%; background-position: 30% center; background-color: #03030a; }
        }

        @media (prefers-reduced-motion: reduce) {
            .jan-box-button { transition-duration: 0.01ms; }
            #menu-btn, #menu-dropdown, #menu-dropdown a, .home-icon { transition-duration: 0.01ms; }
            #menu-dropdown .nav-location, #menu-dropdown .nav-universes { animation: none; }
        }
    </style>
    <link rel="stylesheet" href="assets/agora-menu.css?v=20261106-3">
    <link rel="stylesheet" href="assets/tooltip.css">
    <script defer src="assets/tooltip.js"></script>
</head>
<body>
    <a class="shepherd-logo" href="Shepherd.html" aria-label="Shepherd" data-help="Shepherd">
        <span role="img" aria-label="Shepherd"></span>
    </a>

    <button class="jan-box-button" id="jan-box-button" type="button" aria-label="Abrir el cajón de sastre de Jan" aria-haspopup="dialog" data-help="Abrir el cajón de sastre de Jan"></button>

    <dialog class="jan-terminal" id="jan-terminal" aria-labelledby="jan-terminal-title">
        <div class="jan-monitor">
          <div class="jan-terminal-screen">
            <div class="jan-terminal-header">
                <h2 id="jan-terminal-title">Cajón de sastre de Jan</h2>
                <button class="jan-terminal-close" id="jan-terminal-close" type="button" aria-label="Cerrar el cajón de sastre" data-help="Cerrar el cajón de sastre">×</button>
            </div>
            <div class="jan-terminal-content">
                <p>Contenido en preparación.</p>
            </div>
            <div class="jan-terminal-prompt">
                <label for="jan-terminal-input">C:\&gt;</label>
                <input class="jan-terminal-input" id="jan-terminal-input" type="text" aria-label="Escribir en el cajón de sastre" aria-describedby="jan-terminal-input-help" autocomplete="off">
            </div>
            <p class="jan-terminal-help" id="jan-terminal-input-help">El texto no se envía ni se guarda.</p>
          </div>
          <p class="jan-terminal-brand">PC Amstrad 1512</p>
        </div>
        <div class="jan-monitor-stand" aria-hidden="true"></div>
        <div class="jan-computer">
            <div class="jan-floppy-drive" aria-label="Disquetera de 5¼ pulgadas de doble densidad" role="img">
                <span class="jan-floppy-slot" aria-hidden="true"></span>
                <span class="jan-floppy-label" aria-hidden="true">5¼&quot; DOUBLE DENSITY</span>
            </div>
            <button class="jan-terminal-power" id="jan-terminal-power" type="button" aria-label="Apagar el monitor y cerrar el cajón" data-help="Apagar el monitor">ON / OFF</button>
        </div>
    </dialog>

    <!-- MENÚ DESPLEGABLE -->
    <div id="menu-container">
        <button id="menu-btn" type="button" data-help="Menú de navegación" aria-label="Abrir menú de navegación" aria-controls="menu-dropdown" aria-expanded="false"></button>
        <div id="menu-dropdown">
            <a class="nav-home" href="index.html" aria-label="Inicio" data-help="Inicio">
                <svg class="home-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 10.5 12 3l9 7.5M5.5 9.5V21h13V9.5M9 21v-7h6v7"></path>
                </svg>
            </a>
            <a class="nav-location" href="donde-estoy.html">¿Dónde estoy?</a>
            <a class="nav-universes" href="universos.html">Refugio de Universos</a>
            <a class="nav-symposion" href="https://discord.gg/RnQvtGRNmj" target="_blank" rel="noopener noreferrer"><span class="agora-steel">Ágora Eleúthera</span> <span class="greek" lang="el">ευθέρα ἀγορά</span></a>
            <a class="nav-contact" href="contacto.html">Contacto</a>
        </div>
    </div>

    <script>
        const janBoxButton = document.getElementById('jan-box-button');
        const janTerminal = document.getElementById('jan-terminal');
        janBoxButton.addEventListener('click', () => janTerminal.showModal());
        document.getElementById('jan-terminal-close').addEventListener('click', () => janTerminal.close());
        document.getElementById('jan-terminal-power').addEventListener('click', () => janTerminal.close());
        janTerminal.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                event.preventDefault();
                janTerminal.close();
            }
        });
        janTerminal.addEventListener('close', () => janBoxButton.focus());

        const menuBtn = document.getElementById('menu-btn');
        const menuContainer = document.getElementById('menu-container');

        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isOpen = menuContainer.classList.toggle('is-open');
            menuBtn.setAttribute('aria-expanded', String(isOpen));
            menuBtn.setAttribute('aria-label', isOpen ? 'Cerrar menú de navegación' : 'Abrir menú de navegación');
            menuBtn.dataset.help = isOpen ? 'Cerrar menú de navegación' : 'Abrir menú de navegación';
        });

        window.addEventListener('click', () => {
            menuContainer.classList.remove('is-open');
            menuBtn.setAttribute('aria-expanded', 'false');
            menuBtn.setAttribute('aria-label', 'Abrir menú de navegación');
            menuBtn.dataset.help = 'Abrir menú de navegación';
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && menuContainer.classList.contains('is-open')) {
                menuContainer.classList.remove('is-open');
                menuBtn.setAttribute('aria-expanded', 'false');
                menuBtn.setAttribute('aria-label', 'Abrir menú de navegación');
                menuBtn.dataset.help = 'Abrir menú de navegación';
                menuBtn.focus();
            }
        });
    </script>
    <script src="musica.js"></script>
</body>
</html>
